name: Runtime Conformance

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/runtime-lab.yml"
      - "deno.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "e2e/**"
      - "eng/**"
      - "jsr/**"
      - "runtime-tests/**"
  pull_request:
    paths:
      - ".github/workflows/runtime-lab.yml"
      - "deno.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "e2e/**"
      - "eng/**"
      - "jsr/**"
      - "runtime-tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded:
    name: Embedded and web runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .runtime-lab
          key: runtime-lab-v1-${{ hashFiles('runtime-tests/setup.ts') }}-${{ github.sha }}
          restore-keys: |
            runtime-lab-v1-${{ hashFiles('runtime-tests/setup.ts') }}-
            runtime-lab-v1-

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake libffi-dev

      - run: pnpm install --frozen-lockfile

      - name: Prepare alternate runtimes
        run: deno task runtime-lab:setup

      - name: Test alternate runtimes
        run: deno task test:runtime-lab

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser and workerd
        run: deno task test:e2e

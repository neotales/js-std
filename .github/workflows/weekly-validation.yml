name: Nightly Audit

# Weekly sweep of dev. This is not part of the pull request path: it exists to catch a
# dependency advisory and a toolchain release that the tiered workflows would not see on a
# given commit. The browser and embedded tiers already have their own nightly schedule in
# conformance.yml, so this job stays deliberately narrow.

on:
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency audit and full core sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: pnpm install --frozen-lockfile

      # lint, format, dependency audit, then every module on all three core runtimes.
      - run: deno task check
      - run: deno task readme:check

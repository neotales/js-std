name: Core

# Tier 1 of the conformance ladder. Runs on every push, so it has to stay cheap: no engine
# builds, no browser download, only the three runtimes that publish the packages.
#
# Tier 2 (web) and tier 3 (embedded) live in conformance.yml and only run on a pull request,
# a push to dev, or a manual dispatch, so a normal branch push never waits on cmake or V8.

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # The runtime tables are generated from runtimes.json, so a stale README is a failure
      # rather than a documentation drift nobody notices.
      - name: Verify the runtime support tables
        run: deno task readme:check

      - run: deno task fmt:check
      - run: deno task lint

  test:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [deno, node, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.runtime == 'bun'

      - run: pnpm install --frozen-lockfile

      # Deno already type-checks, so Node and Bun skip it and only run the suites.
      - name: Test with Deno
        if: matrix.runtime == 'deno'
        run: deno task test --deno

      - name: Test with Node
        if: matrix.runtime == 'node'
        run: deno task test --node

      - name: Test with Bun
        if: matrix.runtime == 'bun'
        run: deno task test --bun

name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-r[0-9]*"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-nightly.r[0-9]*"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-beta.r[0-9]*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile
      - run: deno task release:prepare "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ github.ref_name }}-packages"
          path: artifacts/${{ github.ref_name }}/
          if-no-files-found: error

      - env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: |
          deno eval --allow-read --allow-run --allow-net '
            const release = JSON.parse(await Deno.readTextFile("artifacts/${{ github.ref_name }}/release.json"));
            for (const pkg of release.packages) {
              if ((await fetch(`https://jsr.io/${pkg.jsrName}/meta.json`)).ok) {
                const output = await new Deno.Command("deno", { args: ["publish"], cwd: `jsr/${pkg.module}`, stdin: "inherit", stdout: "inherit", stderr: "inherit" }).output();
                if (!output.success) Deno.exit(output.code);
              } else console.log(`Skipping JSR publish for ${pkg.jsrName}; package does not exist.`);
              if ((await fetch(`https://registry.npmjs.org/${pkg.npmName}`)).ok) {
                const output = await new Deno.Command("pnpm", { args: ["publish", `../../artifacts/${{ github.ref_name }}/${pkg.tarball}`, "--access", "public", "--registry", "https://registry.npmjs.org"], cwd: `npm/${pkg.module}`, stdin: "inherit", stdout: "inherit", stderr: "inherit" }).output();
                if (!output.success) Deno.exit(output.code);
              } else console.log(`Skipping npm publish for ${pkg.npmName}; package does not exist.`);
            }
          '

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file "artifacts/${{ github.ref_name }}/CHANGELOG.md" artifacts/${{ github.ref_name }}/*.tgz
